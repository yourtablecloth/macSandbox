name: Release DMG

# DMG packaging automation.
# - Default (no secrets): builds an ad-hoc signed DMG and uploads it as an artifact.
# - If secrets are present, automatically applies Developer ID signing (+notarization) as well (no code changes needed).
#   Signing:  MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD, MACOS_DEVELOPER_ID
#   Notarization:  NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password)
# - On a tag (v*) push, creates a GitHub Release and attaches the DMG as an asset.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0). Leave empty for 0.0.0-dev"
        required: false

permissions:
  contents: write   # create gh release / upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install EDK II build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools build-essential gcc-aarch64-linux-gnu git nasm python3 uuid-dev

      - name: Build branded EDK II firmware
        run: scripts/build_firmware.sh --native

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: macsandbox-edk2
          path: .build/firmware/
          if-no-files-found: error

  build:
    needs: firmware
    # Standard Apple Silicon (arm64) runner — free for public repositories.
    # Matches the arm64_sonoma bottles (scripts/qemu-bottles.lock.json) and LSMinimumSystemVersion 14.0.
    runs-on: macos-14
    env:
      # Signing (Developer ID if present, otherwise ad-hoc)
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      # Notarization (notarize+staple if present) — package_app.sh reads these variables directly
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          [ -n "$V" ] || V="0.0.0-dev"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Install build dependencies (FreeRDP, wimlib)
        run: brew install freerdp wimlib

      - name: Download branded EDK II firmware
        uses: actions/download-artifact@v8
        with:
          name: macsandbox-edk2
          path: .build/firmware

      - name: Bundle vendor QEMU
        run: python3 scripts/bundle_qemu.py --force --fallback-brew --require-custom-firmware

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
        run: |
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          # Add the build keychain to the front of the search list (keeping existing entries)
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/[”"]//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build & package DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEVELOPER_ID: ${{ env.MACOS_DEVELOPER_ID }}   # if empty, package_app.sh uses ad-hoc
        run: scripts/package_app.sh

      - name: Verify DMG integrity
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: hdiutil verify "dist/macSandbox-for-Windows-$VERSION.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macSandbox-for-Windows-${{ steps.ver.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
